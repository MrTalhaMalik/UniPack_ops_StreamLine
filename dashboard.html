<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Unipack Ops StreamLine</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1>Operations Dashboard</h1>
      <div class="subtitle">Live snapshot of production, inventory, and orders across all three lines.</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button type="button" id="reset-data-btn" class="btn btn-outline btn-sm">Reset Demo Data</button>
      <a href="inventory.html" class="btn btn-outline">Inventory</a>
      <a href="management.html" class="btn btn-outline">Management Insights</a>
      <a href="orders.html" class="btn btn-outline">+ New Order</a>
      <a href="orders-tv.html" class="btn btn-primary" target="_blank">Open Floor TV</a>
    </div>
  </div>

  <div class="grid grid-stats" id="inventory-stats"></div>

  <div class="grid grid-2 section-gap">
    <div class="card">
      <div class="card-title">Anomalies &amp; Compliance</div>
      <div id="anomaly-panel"></div>
    </div>
    <div class="card">
      <div class="card-title">Floor Queue (Awaiting Production)</div>
      <div id="queue-panel"></div>
    </div>
  </div>

  <div class="card section-gap">
    <div class="card-title">Recent Activity</div>
    <div class="activity-list" id="activity-feed"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
