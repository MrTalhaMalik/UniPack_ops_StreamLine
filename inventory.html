<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory — Unipack Ops StreamLine</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1>Inventory</h1>
      <div class="subtitle">Current stock on hand, by product.</div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="inv-search" placeholder="Search by product or code…" style="max-width:280px;" />
    <label for="inv-category">Category</label>
    <select id="inv-category">
      <option value="__all__">All Categories</option>
    </select>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Product</th>
            <th>Category</th>
            <th style="text-align:right;">In Inventory</th>
          </tr>
        </thead>
        <tbody id="inventory-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
