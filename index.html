<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unipack Ops StreamLine — Sign In</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="nav-brand-mark">UP</span>
      <span class="login-brand-text">Unipack<span>Ops StreamLine</span></span>
    </div>

    <div class="login-error" id="login-error">Incorrect username or password.</div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="e.g. admin" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="demo-accounts">
      <div class="demo-row"><span>Admin (full access)</span><code>admin / admin123</code></div>
      <div class="demo-row"><span>Data Entry (entry only)</span><code>dataentry / entry123</code></div>
      <div class="demo-row"><span>Fulfillment (orders only)</span><code>fulfillment / fulfill123</code></div>
      <div class="demo-row"><span>Floor TV (no login needed)</span><code>orders-tv.html</code></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  seedIfEmpty();

  // already logged in? skip straight to the right home page
  (function () {
    const session = getSession();
    if (session) window.location.href = homeFor(session.role);
  })();

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (login(username, password)) {
      const session = getSession();
      window.location.href = homeFor(session.role);
    } else {
      errorBox.classList.add('show');
    }
  });
</script>
</body>
</html>
