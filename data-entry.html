<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Entry — Unipack Ops StreamLine</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="entry-shell">
  <div class="entry-hero">
    <h1>Count Entry</h1>
    <p>Enter the numbers exactly as written on the paper slip. That's it — nothing else on this screen.</p>
  </div>

  <div class="entry-tabs">
    <button class="entry-tab active" data-tab="production">Production Count</button>
    <button class="entry-tab" data-tab="received">Inventory Received Count</button>
  </div>

  <div class="entry-panel active" id="panel-production">
    <div class="card">
      <form id="production-form">
        <div class="form-group">
          <label for="prod-product-search">Product</label>
          <div class="product-picker" id="prod-product-picker">
            <input type="text" class="pp-search" id="prod-product-search" placeholder="Search by name or code…" autocomplete="off" />
            <input type="hidden" class="pp-hidden" id="prod-product" />
            <div class="pp-panel"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="prod-qty">Quantity Made</label>
          <input type="number" id="prod-qty" min="1" placeholder="e.g. 10" />
        </div>
        <div class="form-group">
          <div class="checkbox-row">
            <input type="checkbox" id="prod-bypass" />
            <label for="prod-bypass" style="margin:0;">This batch was handed straight to a customer (did NOT go to inventory)</label>
          </div>
        </div>
        <div class="form-group" id="prod-customer-group" style="display:none;">
          <label for="prod-customer">Customer Name</label>
          <input type="text" id="prod-customer" placeholder="Who received it directly" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit Production Count</button>
      </form>
    </div>
  </div>

  <div class="entry-panel" id="panel-received">
    <div class="card">
      <form id="received-form">
        <div class="form-group">
          <label for="recv-batch">Which Batch Are You Receiving?</label>
          <select id="recv-batch"></select>
          <div class="form-hint" id="recv-empty-hint" style="display:none;">No batches are currently waiting on inventory count.</div>
        </div>
        <div class="form-group">
          <label for="recv-qty">Quantity Counted at Inventory</label>
          <input type="number" id="recv-qty" min="0" placeholder="e.g. 9" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit Received Count</button>
      </form>
    </div>
  </div>

  <div class="recent-log">
    <div class="card-title" style="margin-top:24px;">Your Submissions This Session</div>
    <div id="session-log"><div class="empty-state">Nothing submitted yet.</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/product-picker.js"></script>
<script src="js/data-entry.js"></script>
</body>
</html>
